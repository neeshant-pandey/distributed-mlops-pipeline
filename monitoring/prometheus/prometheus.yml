# Prometheus configuration for DeepLOB MLOps Pipeline

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'deeplob-monitor'

# Scrape configurations
scrape_configs:
  # DeepLOB API metrics
  - job_name: 'deeplob_api'
    static_configs:
      - targets: ['api:8000']
        labels:
          service: 'prediction_api'
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
